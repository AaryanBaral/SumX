version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sumx_postgres_db
    environment:
      POSTGRES_DB: sumx_master
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresPassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sumx_master"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sumx_api_service
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__MasterDb=Host=db;Port=5432;Database=sumx_master;Username=postgres;Password=postgresPassword
      - Jwt__SecretKey=SuperSecretJWTKeyThatIsLongEnoughToPreventErrors123!
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
